<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }
        .welcome-box {
            background-color: #12e17a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: white;
            font-weight: bold;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .grid-item {
            background-color: #f4f4f4;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #555;
            transition: 0.3s;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }
        .grid-item:hover {
            background-color: #17cc69;
            color: white;
        }
        .grid-item a {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .grid-item i {
            font-size: 24px;
            margin-bottom: 5px;
        }
    </style>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="welcome-box">
            Welcome, {{ session['customer_name'] }}! <br>
            Your Household ID: {{ session['household_id'] }}
        </div>
        <div class="grid-container">
            <div class="grid-item"><a href="{{ url_for('customer_history') }}"><i class="fas fa-calendar-alt"></i> History</a></div>
            <div class="grid-item"><a href="{{ url_for('customer_rewards') }}"><i class="fas fa-trophy"></i> Rewards</a></div>
            <div class="grid-item"><a href="{{ url_for('customer_help') }}"><i class="fas fa-question-circle"></i> Help</a></div>
            <div class="grid-item"><a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a></div>
        </div>
    </div>
</body>
</html>
